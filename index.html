<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anuga AI</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; }
        .chat-container { height: calc(100vh - 180px); overflow-y: auto; scroll-behavior: smooth; }
        .message-bubble { max-width: 80%; padding: 12px 16px; border-radius: 12px; margin-bottom: 12px; line-height: 1.5; word-wrap: break-word; }
        .user-msg { background-color: #3b82f6; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai-msg { background-color: #1e293b; color: #cbd5e1; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #334155; }
        .ai-msg img { max-width: 100%; border-radius: 8px; margin-top: 10px; display: block; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #3b82f6; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>

<body class="flex flex-col h-screen">

<!-- Login -->
<div id="login-overlay" class="fixed inset-0 bg-slate-900 z-50 flex items-center justify-center">
    <div class="text-center p-8 bg-slate-800 rounded-2xl border border-slate-700 max-w-md w-full">
        <h1 class="text-4xl font-bold text-blue-500 mb-2">Anuga AI</h1>
        <button id="google-login-btn" class="w-full bg-white text-black py-3 rounded-lg flex items-center justify-center gap-3">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5">
            Sign in with Google
        </button>
        <p id="login-error" class="text-red-400 mt-4 text-sm hidden"></p>
    </div>
</div>

<!-- App -->
<div id="app-interface" class="hidden flex-col h-full max-w-4xl mx-auto w-full">

<header class="p-4 border-b border-slate-800 flex justify-between">
    <h1>Anuga AI</h1>
    <button id="logout-btn">Logout</button>
</header>

<div id="chat-history" class="chat-container flex-1 p-4 flex flex-col">
    <div class="ai-msg message-bubble">Hello! 👋</div>
</div>

<div class="p-4">
    <button onclick="setMode('chat')">Chat</button>
    <button onclick="setMode('text')">Text</button>
    <button onclick="setMode('image')">Image</button>

    <form id="input-form" class="flex gap-2 mt-2">
        <input id="user-input" class="w-full p-2 bg-slate-800 rounded">
        <button type="submit">Send</button>
    </form>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSy...",
    authDomain: "anuga-ai.firebaseapp.com",
    projectId: "anuga-ai"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

const loginBtn = document.getElementById('google-login-btn');
const logoutBtn = document.getElementById('logout-btn');
const loginOverlay = document.getElementById('login-overlay');
const appInterface = document.getElementById('app-interface');

loginBtn.onclick = () => signInWithPopup(auth, provider);
logoutBtn.onclick = () => signOut(auth);

onAuthStateChanged(auth, user => {
    if (user) {
        loginOverlay.classList.add('hidden');
        appInterface.classList.remove('hidden');
        appInterface.classList.add('flex');
    } else {
        loginOverlay.classList.remove('hidden');
        appInterface.classList.add('hidden');
    }
});

const chatHistory = document.getElementById('chat-history');
const inputForm = document.getElementById('input-form');
const userInput = document.getElementById('user-input');

let currentMode = 'chat';

window.setMode = (m) => currentMode = m;

function appendMessage(role, content, isImage=false){
    const div = document.createElement('div');
    div.className = 'message-bubble ' + (role==='user'?'user-msg':'ai-msg');

    if(isImage){
        div.innerHTML = `<img src="${content}">`;
    } else {
        div.innerHTML = content;
    }

    chatHistory.appendChild(div);
}

function showLoading(){
    const d=document.createElement('div');
    d.id="loading";
    d.innerHTML="...";
    chatHistory.appendChild(d);
}
function removeLoading(){
    document.getElementById('loading')?.remove();
}

/* =========================
   FIXED API SECTION
========================= */

inputForm.addEventListener('submit', async (e)=>{
    e.preventDefault();

    const query = userInput.value.trim();
    if(!query) return;

    appendMessage('user', query);
    userInput.value="";
    showLoading();

    try{
        let responseText="";
        let isImage=false;

        if(currentMode==='image'){
            const res = await fetch(`https://dtz-ai-api-new.vercel.app/api/ai/ai-image?prompt=${encodeURIComponent(query)}`);
            if(!res.ok) throw new Error("Image API failed");

            let data;
            try{ data = await res.json(); }
            catch{ data = await res.text(); }

            if(typeof data==="string" && data.startsWith("http")){
                responseText=data;
            } else if(data.url){
                responseText=data.url;
            } else if(data.image){
                responseText=data.image;
            } else {
                throw new Error("Invalid image response");
            }

            isImage=true;
        }

        else if(currentMode==='chat'){
            const res = await fetch(`https://www.movanest.xyz/v2/powerbrainai?query=${encodeURIComponent(query)}`);
            if(!res.ok) throw new Error("Chat API failed");

            let data;
            try{ data = await res.json(); }
            catch{ responseText = await res.text(); }

            if(!responseText){
                responseText = data?.result || data?.message || "No response";
            }
        }

        else if(currentMode==='text'){
            const res = await fetch(`https://www.movanest.xyz/v2/pollination?text=${encodeURIComponent(query)}`);
            if(!res.ok) throw new Error("Text API failed");

            let data;
            try{ data = await res.json(); }
            catch{ responseText = await res.text(); }

            if(!responseText){
                responseText = data?.result || data?.message || "No response";
            }
        }

        removeLoading();
        appendMessage('ai', responseText, isImage);

    } catch(err){
        removeLoading();
        appendMessage('ai', "⚠️ Error: " + err.message);
    }
});
</script>

</body>
</html>
