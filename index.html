<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anuga AI</title>

<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@300;400;600&family=Inter:wght@300;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
  getFirestore, collection, addDoc,
  query, where, getDocs
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAc5MWSak896NdYs6Luv_b0IBmEPMOdXgE",
  authDomain: "anugasenithu-3912d.firebaseapp.com",
  projectId: "anugasenithu-3912d",
  storageBucket: "anugasenithu-3912d.firebasestorage.app",
  messagingSenderId: "372208145555",
  appId: "1:372208145555:web:39e0552bb9c58b1469e966"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.firebaseAuth = auth;
window.firebaseDB = db;
window.fbFns = {
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut,
  collection,
  addDoc,
  query,
  where,
  getDocs
};
</script>

</head>

<body>

<!-- LOGIN -->
<div id="authBox" class="authBox">
  <h2>Anuga AI</h2>
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button onclick="signup()">Sign Up</button>
  <button onclick="login()">Login</button>
</div>

<!-- CHAT -->
<div id="chatUI" class="hidden">
  <header>
    Anuga AI
    <button onclick="logout()">Logout</button>
  </header>

  <div id="chat"></div>

  <div class="inputBar">
    <input id="msg" placeholder="Ask anything...">
    <button onclick="send()">Send</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
