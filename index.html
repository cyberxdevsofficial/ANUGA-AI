<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anuga AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0f172a; 
            color: #e2e8f0; 
            overflow: hidden;
        }

        /* Watermark */
        .watermark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-45deg);
            font-size: 8vw;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.03);
            pointer-events: none;
            z-index: 0;
            white-space: nowrap;
            user-select: none;
        }

        /* Glassmorphism Utilities */
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .app-container { display: flex; height: 100vh; position: relative; z-index: 1; }
        
        /* Sidebar */
        .sidebar { width: 280px; background: #020617; border-right: 1px solid #1e293b; display: flex; flex-direction: column; transition: transform 0.3s ease; z-index: 20; }
        .sidebar.hidden-mobile { transform: translateX(-100%); position: absolute; height: 100%; }
        @media (min-width: 768px) {
            .sidebar { position: relative; transform: none; }
            .sidebar.hidden-mobile { transform: none; position: relative; }
        }

        /* Chat Area */
        .main-content { flex: 1; display: flex; flex-direction: column; position: relative; background: transparent; }
        .chat-container { flex: 1; overflow-y: auto; scroll-behavior: smooth; padding: 1.5rem; }
        
        /* Messages */
        .message-bubble { max-width: 85%; padding: 14px 18px; border-radius: 16px; margin-bottom: 16px; line-height: 1.6; word-wrap: break-word; position: relative; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .user-msg { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color: white; align-self: flex-end; border-bottom-right-radius: 4px; margin-left: auto; }
        .ai-msg { background: #1e293b; color: #e2e8f0; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #334155; }
        .ai-msg img { max-width: 100%; border-radius: 12px; margin-top: 12px; display: block; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        
        /* Loader */
        .loader { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #3b82f6; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* History Item */
        .history-item { padding: 12px 16px; margin-bottom: 6px; border-radius: 8px; cursor: pointer; color: #94a3b8; transition: all 0.2s; display: flex; justify-content: space-between; align-items: center; }
        .history-item:hover { background-color: #1e293b; color: white; }
        .history-item.active { background-color: #1e293b; color: white; border-left: 4px solid #3b82f6; }
        .delete-chat-btn { opacity: 0; color: #ef4444; padding: 6px; transition: opacity 0.2s; border-radius: 4px; }
        .delete-chat-btn:hover { background: rgba(239, 68, 68, 0.1); }
        .history-item:hover .delete-chat-btn { opacity: 1; }
    </style>
</head>
<body class="flex flex-col h-screen">

    <!-- Watermark -->
    <div class="watermark">ANUGA SENITHU</div>

    <!-- Login Overlay -->
    <div id="login-overlay" class="fixed inset-0 bg-slate-900 z-50 flex items-center justify-center backdrop-blur-sm">
        <div class="text-center p-10 glass rounded-3xl shadow-2xl border border-slate-700 max-w-md w-full mx-4">
            <div class="w-16 h-16 bg-blue-600 rounded-2xl mx-auto flex items-center justify-center mb-6 shadow-lg shadow-blue-500/30">
                <i class="fa-solid fa-robot text-white text-3xl"></i>
            </div>
            <h1 class="text-4xl font-bold text-white mb-2 tracking-tight">Anuga AI</h1>
            <p class="text-slate-400 mb-8 text-lg">Powered by Anuga Senithu</p>
            <button id="google-login-btn" class="w-full bg-white text-slate-900 font-bold py-4 px-6 rounded-xl hover:bg-gray-100 transition duration-200 flex items-center justify-center gap-3 shadow-lg">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" class="w-6 h-6">
                Sign in with Google
            </button>
            <p id="login-error" class="text-red-400 mt-4 text-sm hidden"></p>
        </div>
    </div>

    <!-- Main App Interface -->
    <div id="app-interface" class="hidden app-container">
        
        <!-- Sidebar Navigation -->
        <aside id="sidebar" class="sidebar hidden-mobile absolute md:relative h-full glass">
            <div class="p-5 border-b border-slate-800 flex justify-between items-center">
                <div class="flex items-center gap-3 font-bold text-xl text-white">
                    <i class="fa-solid fa-robot text-blue-500"></i> Anuga AI
                </div>
                <button id="close-sidebar" class="md:hidden text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <div class="p-4">
                <button onclick="startNewChat()" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-3 px-4 rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-blue-600/20 font-medium">
                    <i class="fa-solid fa-plus"></i> New Chat
                </button>
            </div>

            <div class="flex-1 overflow-y-auto px-3 py-2" id="history-list">
                <!-- History items injected here -->
            </div>

            <div class="p-4 border-t border-slate-800 bg-slate-900/50">
                <!-- Admin Link (Hidden by default) -->
                <a id="admin-link" href="/admin" class="hidden flex items-center gap-3 w-full p-3 rounded-lg hover:bg-purple-900/30 text-purple-400 transition mb-2 border border-purple-500/20">
                    <i class="fa-solid fa-shield-halved"></i>
                    <span class="font-medium">Admin Panel</span>
                </a>

                <!-- Support Button -->
                <a href="https://wa.me/+94776579018" target="_blank" class="flex items-center gap-3 w-full p-3 rounded-lg hover:bg-green-900/30 text-green-400 transition mb-2 border border-green-500/20">
                    <i class="fa-brands fa-whatsapp text-xl"></i>
                    <span class="font-medium">Support</span>

                <div class="flex items-center gap-3 pt-3 border-t border-slate-800 mt-2">
                    <img id="user-avatar" src="" class="w-9 h-9 rounded-full bg-slate-700 border border-slate-600">
                    <div class="flex-1 overflow-hidden">
                        <p id="user-name" class="text-sm font-semibold truncate text-white">User</p>
                        <p id="user-email" class="text-xs text-slate-500 truncate">user@example.com</p>
                    </div>
                    <button id="logout-btn" class="text-slate-400 hover:text-white p-2 rounded-lg hover:bg-slate-800 transition">

        </aside>

        <!-- Main Chat Area -->
        <main class="main-content">
            <header class="md:hidden p-4 border-b border-slate-800 flex justify-between items-center glass">
                <button id="open-sidebar" class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
                <span class="font-bold text-white">Anuga AI</span>
                <div class="w-6"></div>
            </header>

            <div id="chat-history" class="chat-container flex flex-col gap-2">
                <div class="flex flex-col items-center justify-center h-full text-slate-500 opacity-60" id="empty-state">
                    <i class="fa-solid fa-robot text-6xl mb-4 text-blue-500/50"></i>

                </div>
            </div>

            <div class="p-4 glass border-t border-slate-800">
                <div class="flex gap-2 mb-4 overflow-x-auto pb-1 no-scrollbar">
                    <button onclick="setMode('chat')" id="btn-chat" class="mode-btn flex-1 py-2.5 px-4 rounded-lg text-sm font-medium bg-blue-600 text-white transition flex items-center justify-center gap-2 whitespace-nowrap shadow-lg shadow-blue-600/10">
                        <i class="fa-solid fa-comments"></i> Chat
                    </button>
                    <button onclick="setMode('text')" id="btn-text" class="mode-btn flex-1 py-2.5 px-4 rounded-lg text-sm font-medium bg-slate-800 text-slate-400 hover:bg-slate-700 transition flex items-center justify-center gap-2 whitespace-nowrap">
                        <i class="fa-solid fa-pen-nib"></i> Text Gen
                    </button>
                    <button onclick="setMode('image')" id="btn-image" class="mode-btn flex-1 py-2.5 px-4 rounded-lg text-sm font-medium bg-slate-800 text-slate-400 hover:bg-slate-700 transition flex items-center justify-center gap-2 whitespace-nowrap">
                        <i class="fa-solid fa-image"></i> Image Gen
                    </button>
                </div>

                <form id="input-form" class="relative flex items-center gap-2">
                    <input type="text" id="user-input" placeholder="Type your message..." 
                        class="w-full bg-slate-800/50 text-white border border-slate-700 rounded-xl py-4 pl-5 pr-14 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition placeholder-slate-500 backdrop-blur-sm">
                    <button type="submit" class="absolute right-2 bg-blue-600 hover:bg-blue-500 text-white p-2.5 rounded-lg transition w-11 h-11 flex items-center justify-center shadow-lg shadow-blue-600/20">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </form>
                <p id="mode-indicator" class="text-xs text-slate-500 mt-3 text-center font-medium uppercase tracking-wider">Current Mode: Chatting</p>
            </div>
        </main>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, where, orderBy, onSnapshot, deleteDoc, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAMOO_h3b-dYognoDEl9udim-cD4ZOBpXs",
            authDomain: "anuga-ai.firebaseapp.com",
            projectId: "anuga-ai",
            storageBucket: "anuga-ai.firebasestorage.app",
            messagingSenderId: "853496698656",
            appId: "1:853496698656:web:500862c1e813b37c25a945"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // ADMIN EMAIL CONFIGURATION
        const ADMIN_EMAIL = "anugasenithu@gmail.com"; // CHANGE THIS TO YOUR EMAIL

        // DOM Elements
        const loginOverlay = document.getElementById('login-overlay');
        const appInterface = document.getElementById('app-interface');
        const chatHistoryContainer = document.getElementById('chat-history');
        const userInput = document.getElementById('user-input');
        const inputForm = document.getElementById('input-form');
        const historyList = document.getElementById('history-list');
        const emptyState = document.getElementById('empty-state');
        const sidebar = document.getElementById('sidebar');
        
        // State
        let currentUser = null;
        let currentChatId = null;
        let currentMode = 'chat';
        let unsubscribeChatListener = null;

        // --- Auth Logic ---
        document.getElementById('google-login-btn').addEventListener('click', () => {
            signInWithPopup(auth, provider).catch((error) => {
                document.getElementById('login-error').textContent = error.message;
                document.getElementById('login-error').classList.remove('hidden');
            });
        });

        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                loginOverlay.classList.add('hidden');
                appInterface.classList.remove('hidden');
                appInterface.classList.add('flex');
                
                document.getElementById('user-name').textContent = user.displayName;
                document.getElementById('user-email').textContent = user.email;
                document.getElementById('user-avatar').src = user.photoURL;

                // Check Admin
                if (user.email === ADMIN_EMAIL) {
                    document.getElementById('admin-link').classList.remove('hidden');
                }

                loadUserChats();
            } else {
                currentUser = null;
                loginOverlay.classList.remove('hidden');
                appInterface.classList.add('hidden');
                appInterface.classList.remove('flex');
                if (unsubscribeChatListener) unsubscribeChatListener();
            }
        });

        // --- Firestore Chat Logic ---

        function loadUserChats() {
            const q = query(
                collection(db, "chats"), 
                where("userId", "==", currentUser.uid), 
                orderBy("updatedAt", "desc")
            );

            unsubscribeChatListener = onSnapshot(q, (snapshot) => {
                historyList.innerHTML = '';
                if (snapshot.empty) {
                    startNewChat(); // Create initial chat if none exist
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const chat = docSnap.data();
                    const id = docSnap.id;
                    
                    const div = document.createElement('div');
                    div.className = `history-item ${id === currentChatId ? 'active' : ''}`;
                    div.onclick = () => loadChat(id, chat.messages);
                    
                    const title = chat.title || "New Chat";
                    const shortTitle = title.length > 22 ? title.substring(0, 22) + '...' : title;

                    div.innerHTML = `
                        <div class="flex items-center gap-3 overflow-hidden">
                            <i class="fa-regular fa-message text-slate-500 text-xs"></i>
                            <span class="truncate text-sm">${shortTitle}</span>
                        </div>
                        <button class="delete-chat-btn" onclick="deleteChat(event, '${id}')">
                            <i class="fa-solid fa-trash text-xs"></i>
                        </button>
                    `;
                    historyList.appendChild(div);
                });
            });
        }

        window.startNewChat = async () => {
            const newChatRef = await addDoc(collection(db, "chats"), {
                userId: currentUser.uid,
                userEmail: currentUser.email,
                userName: currentUser.displayName,
                title: "New Chat",
                messages: [],
                mode: 'chat',
                createdAt: serverTimestamp(),
                updatedAt: serverTimestamp()
            });
            loadChat(newChatRef.id, []);
            if (window.innerWidth < 768) sidebar.classList.add('hidden-mobile');
        };

        function loadChat(id, messages) {
            currentChatId = id;
            chatHistoryContainer.innerHTML = '';
            
            if (!messages || messages.length === 0) {
                chatHistoryContainer.appendChild(emptyState);
                emptyState.style.display = 'flex';
            } else {
                emptyState.style.display = 'none';
                messages.forEach(msg => appendMessageToDOM(msg.role, msg.content, msg.isImage));
            }
            
            // Highlight sidebar
            document.querySelectorAll('.history-item').forEach(el => el.classList.remove('active'));
            // Note: Re-rendering sidebar highlights is handled by onSnapshot, 
            // but we force a re-render of classes ideally. For simplicity, we rely on click.
            
            scrollToBottom();
        }

        window.deleteChat = async (e, id) => {
            e.stopPropagation();
            if(confirm("Delete this chat permanently?")) {
                await deleteDoc(doc(db, "chats", id));
                if (currentChatId === id) startNewChat();
            }
        };

        // --- UI Functions ---

        document.getElementById('open-sidebar').addEventListener('click', () => {
            sidebar.classList.remove('hidden-mobile');
            sidebar.style.transform = 'translateX(0)';
        });
        document.getElementById('close-sidebar').addEventListener('click', () => {
            sidebar.classList.add('hidden-mobile');
            sidebar.style.transform = 'translateX(-100%)';
        });

        window.setMode = (mode) => {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white', 'shadow-lg');
                btn.classList.add('bg-slate-800', 'text-slate-400');
            });
            const activeBtn = document.getElementById(`btn-${mode}`);
            activeBtn.classList.remove('bg-slate-800', 'text-slate-400');
            activeBtn.classList.add('bg-blue-600', 'text-white', 'shadow-lg');

            const indicators = {
                'chat': 'Mode: Chatting',
                'text': 'Mode: Text Generation',
                'image': 'Mode: Image Generation'
            };
            document.getElementById('mode-indicator').textContent = indicators[mode];
            userInput.focus();
        };

        function appendMessageToDOM(role, content, isImage = false) {
            if (emptyState.parentNode === chatHistoryContainer) emptyState.style.display = 'none';
            
            const div = document.createElement('div');
            div.className = `message-bubble ${role === 'user' ? 'user-msg' : 'ai-msg'}`;
            
            if (isImage) {
                div.innerHTML = `<p class="mb-2 text-xs opacity-70 uppercase tracking-wide font-bold">Generated Image</p><img src="${content}" alt="AI Image">`;
            } else {
                div.innerHTML = content.replace(/\n/g, '<br>');
            }
            chatHistoryContainer.appendChild(div);
            scrollToBottom();
        }

        function showLoading() {
            if (emptyState.parentNode === chatHistoryContainer) emptyState.style.display = 'none';
            const div = document.createElement('div');
            div.id = 'loading-bubble';
            div.className = 'message-bubble ai-msg';
            div.innerHTML = '<div class="loader"></div>';
            chatHistoryContainer.appendChild(div);
            scrollToBottom();
        }

        function removeLoading() {
            const loader = document.getElementById('loading-bubble');
            if (loader) loader.remove();
        }

        function scrollToBottom() {
            chatHistoryContainer.scrollTop = chatHistoryContainer.scrollHeight;
        }

        // --- Send Message & Save to Firestore ---

        inputForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const queryText = userInput.value.trim();
            if (!queryText || !currentChatId) return;

            appendMessageToDOM('user', queryText);
            userInput.value = '';
            showLoading();

            // Optimistically update Firestore
            const chatRef = doc(db, "chats", currentChatId);
            
            // Update Title if first message
            const chatSnap = await getDocFromCache(currentChatId); // Helper needed or just logic
            // Simplified: We'll update messages array
            
            try {
                // 1. Call API
                const res = await fetch('/api/proxy', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mode: currentMode, query: queryText, userId: currentUser.uid })
                });
                
                const result = await res.json();
                removeLoading();

                if (!res.ok || !result.success) throw new Error(result.error);

                let responseContent = result.data;
                let isImage = result.isImage;

                if (currentMode === 'image' && typeof responseContent === 'string' && responseContent.startsWith('http')) {
                    isImage = true;
                }

                appendMessageToDOM('ai', responseContent, isImage);

                // 2. Save BOTH messages to Firestore in one update
                await updateDoc(chatRef, {
                    messages: [
                        ... (await getChatMessages(currentChatId)), // Get existing
                        { role: 'user', content: queryText, isImage: false, timestamp: Date.now() },
                        { role: 'ai', content: responseContent, isImage: isImage, timestamp: Date.now() }
                    ],
                    updatedAt: serverTimestamp(),
                    title: (await getChatMessages(currentChatId)).length === 0 ? queryText : undefined // Set title if empty
                });

            } catch (error) {
                removeLoading();
                appendMessageToDOM('ai', `Error: ${error.message}`);
            }
        });

        // Helper to get current messages from local state or fetch (Simplified for this demo)
        // In a real app, you'd keep a local state variable for the current chat messages
        async function getChatMessages(chatId) {
            // This is a hacky way to get current messages without complex state management in vanilla JS
            // Ideally, you store `currentMessages` in a variable when `loadChat` is called.
            // For this code to work perfectly, let's assume we fetch it fresh or store it globally.
            // Let's fix this by storing current messages in a global var.
            return window.currentMessagesCache || [];
        }
        
        // Override loadChat to cache messages
        const originalLoadChat = loadChat;
        loadChat = (id, messages) => {
            window.currentMessagesCache = messages || [];
            originalLoadChat(id, messages);
        }

        // Import getDoc for the title update logic
        import { getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        async function getDocFromCache(id) {
             // Not used in final simplified logic above, but good to have
        }

    </script>
</body>
