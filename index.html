<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anuga AI Chat</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=JetBrains+Mono&display=swap" rel="stylesheet">

<!-- Tailwind CDN -->
<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  font-family: 'Roboto', sans-serif;
  margin: 0;
  height: 100vh;
  overflow: hidden;
  background: linear-gradient(135deg, #6C63FF, #5DE7A4);
  position: relative;
}

/* Animated Background Circles */
.background-circle {
  position: absolute;
  border-radius: 50%;
  opacity: 0.2;
  animation: float 15s infinite;
}

.background-circle:nth-child(1) {
  width: 300px; height: 300px; background: #ffffff; top: -50px; left: -50px;
}
.background-circle:nth-child(2) {
  width: 500px; height: 500px; background: #fffa; bottom: -100px; right: -100px;
  animation-duration: 20s;
}
.background-circle:nth-child(3) {
  width: 200px; height: 200px; background: #0002; top: 50%; left: 50%;
  animation-duration: 25s;
}

@keyframes float {
  0% { transform: translateY(0px) translateX(0px); }
  50% { transform: translateY(50px) translateX(50px); }
  100% { transform: translateY(0px) translateX(0px); }
}

.chat-container {
  position: relative;
  z-index: 10;
  width: 100%;
  max-width: 500px;
  height: 80vh;
  margin: auto;
  margin-top: 5vh;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(20px);
  border-radius: 25px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 15px 40px rgba(0,0,0,0.3);
}

.chat-box {
  flex: 1;
  padding: 15px;
  overflow-y: auto;
}

.message {
  margin: 8px 0;
  padding: 10px 15px;
  border-radius: 25px;
  max-width: 80%;
  word-wrap: break-word;
  opacity: 0;
  transform: translateY(20px);
  animation: slideIn 0.3s forwards;
}

.user { 
  background-color: #6C63FF;
  color: white;
  align-self: flex-end;
  border-bottom-right-radius: 0;
}

.ai { 
  background-color: #5DE7A4;
  color: white;
  align-self: flex-start;
  border-bottom-left-radius: 0;
}

@keyframes slideIn {
  to { opacity: 1; transform: translateY(0); }
}

.input-container {
  display: flex;
  padding: 10px;
  background: rgba(255,255,255,0.2);
  border-top: 1px solid #ddd;
}

.input-container input {
  flex: 1;
  padding: 12px 20px;
  border-radius: 50px;
  border: 1px solid #ccc;
  font-family: 'JetBrains Mono', monospace;
  outline: none;
  transition: all 0.2s;
}

.input-container input:focus {
  border-color: #6C63FF;
  box-shadow: 0 0 8px #6C63FF66;
}

.input-container button {
  margin-left: 10px;
  background-color: #6C63FF;
  color: white;
  border: none;
  padding: 0 20px;
  border-radius: 50px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
}

.input-container button:hover {
  background-color: #5a50e0;
}

/* Scrollbar Styling */
.chat-box::-webkit-scrollbar { width: 6px; }
.chat-box::-webkit-scrollbar-thumb { background: #6C63FF66; border-radius: 10px; }

/* Loading Spinner */
.spinner {
  border: 3px solid #f3f3f3;
  border-top: 3px solid #5DE7A4;
  border-radius: 50%;
  width: 16px;
  height: 16px;
  animation: spin 1s linear infinite;
  display: inline-block;
  margin-left: 5px;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
</style>
</head>
<body>

<!-- Animated Background Circles -->
<div class="background-circle"></div>
<div class="background-circle"></div>
<div class="background-circle"></div>

<div class="chat-container">
  <div id="chatBox" class="chat-box"></div>
  <div class="input-container">
    <input type="text" id="queryInput" placeholder="Ask Anuga AI..." />
    <button onclick="sendQuery()">Send</button>
  </div>
</div>

<script>
async function sendQuery() {
  const queryInput = document.getElementById('queryInput');
  const text = queryInput.value.trim();
  if (!text) return;

  addMessage('user', text);
  queryInput.value = '';

  const chatBox = document.getElementById('chatBox');

  // AI typing indicator
  const typingIndicator = document.createElement('div');
  typingIndicator.className = 'message ai';
  typingIndicator.innerHTML = "Anuga AI is typing <span class='spinner'></span>";
  chatBox.appendChild(typingIndicator);
  chatBox.scrollTop = chatBox.scrollHeight;

  const apiUrl = "https://www.movanest.xyz/v2/powerbrainai?query=" 
                 + encodeURIComponent(text);

  try {
    const response = await fetch(apiUrl);
    const result = await response.json();

    typingIndicator.remove();

    // Use the "results" field from API
    let reply = "No response received.";
    if(result && result.results) reply = result.results;

    addMessage('ai', reply);

  } catch (err) {
    console.error(err);
    typingIndicator.remove();
    addMessage('ai', "Error connecting to Anuga AI API. Check your API endpoint or CORS.");
  }
}

function addMessage(sender, message) {
  const chatBox = document.getElementById('chatBox');
  const div = document.createElement('div');
  div.className = 'message ' + sender;
  div.innerHTML = message;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}
</script>

</body>
  </html>
