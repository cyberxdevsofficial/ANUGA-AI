<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anuga AI</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">

<style>
html,body{
    margin:0;
    height:100%;
    font-family:'Inter',sans-serif;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    display:flex;
    flex-direction:column;
}

.chat{
    flex:1;
    overflow-y:auto;
    padding:15px;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.msg{
    padding:12px 16px;
    border-radius:12px;
    max-width:80%;
    word-wrap:break-word;
}

.user{
    background:#00c6ff;
    color:black;
    margin-left:auto;
}

.ai{
    background:rgba(255,255,255,0.1);
    color:white;
}

.input-area{
    display:flex;
    padding:10px;
    border-top:1px solid rgba(255,255,255,0.1);
    gap:6px;
}

input{
    flex:1;
    padding:12px;
    border:none;
    border-radius:8px;
    background:rgba(255,255,255,0.15);
    color:white;
}

button{
    border:none;
    border-radius:8px;
    cursor:pointer;
}

/* PLUS BUTTON */
#uploadBtn{
    background:#111;
    color:white;
    width:40px;
    font-size:22px;
}

/* SEND BUTTON */
#sendBtn{
    background:black;
    color:white;
    padding:0 16px;
}

/* Footer */
.footer{
    text-align:center;
    padding:8px;
    font-size:12px;
    background:rgba(0,0,0,0.3);
    color:#ccc;
}

.brand{
    font-family:'Playfair Display',serif;
    font-weight:900;
    color:white;
}

/* Code blocks */
pre{
    background:rgba(0,0,0,0.3);
    padding:10px;
    border-radius:8px;
    overflow-x:auto;
}

.copy-btn{
    position:absolute;
    right:5px;
    top:5px;
    background:black;
    color:white;
    font-size:12px;
    padding:2px 6px;
}
</style>
</head>
<body>

<div id="chat" class="chat"></div>

<div class="input-area">
    <input type="file" id="fileInput" hidden accept="image/*">
    <button id="uploadBtn">+</button>
    <input id="input" placeholder="Enter prompt...">
    <button id="sendBtn">Send</button>
</div>

<footer class="footer">
POWERED BY <span class="brand">ANUGA SENITHU IN DARK TECH ZONE TM</span>
</footer>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const uploadBtn = document.getElementById("uploadBtn");
const fileInput = document.getElementById("fileInput");

let uploadedImageURL = null;

/* Add message */
function addMessage(text,cls){
    const div=document.createElement("div");
    div.className="msg "+cls;
    div.textContent=text;
    chat.appendChild(div);
    chat.scrollTop=chat.scrollHeight;
}

/* Upload button click */
uploadBtn.onclick=()=>fileInput.click();

/* Upload image to imgbb */
fileInput.onchange=async()=>{
    const file=fileInput.files[0];
    if(!file) return;

    addMessage("Uploading image...","ai");

    const formData=new FormData();
    formData.append("image",file);

    try{
        const res=await fetch("https://api.imgbb.com/1/upload?key=ec928269b51f9266fd93069778808d44",{
            method:"POST",
            body:formData
        });

        const data=await res.json();
        uploadedImageURL=data.data.url;

        addMessage("Image uploaded successfully.","ai");

        // Show preview
        const img=document.createElement("img");
        img.src=uploadedImageURL;
        img.style.maxWidth="200px";
        const div=document.createElement("div");
        div.className="msg user";
        div.appendChild(img);
        chat.appendChild(div);

    }catch(err){
        addMessage("Upload failed.","ai");
    }
};

/* Send prompt */
sendBtn.onclick=async()=>{
    const prompt=input.value.trim();
    if(!prompt) return;

    addMessage(prompt,"user");
    input.value="";

    if(!uploadedImageURL){
        addMessage("Please upload an image first.","ai");
        return;
    }

    addMessage("Processing image...","ai");

    try{
        const apiURL=`https://www.movanest.xyz/v2/nanobanana-pub?image_url=${encodeURIComponent(uploadedImageURL)}&prompt=${encodeURIComponent(prompt)}&maxTries=20`;

        const res=await fetch(apiURL);
        const data=await res.json();

        if(data.output_url){
            const img=document.createElement("img");
            img.src=data.output_url;
            img.style.maxWidth="250px";

            const div=document.createElement("div");
            div.className="msg ai";
            div.appendChild(img);
            chat.appendChild(div);
        }else{
            addMessage("No image returned.","ai");
        }

    }catch(err){
        addMessage("API failed.","ai");
    }

    chat.scrollTop=chat.scrollHeight;
};

/* Enter key */
input.addEventListener("keypress",e=>{
    if(e.key==="Enter") sendBtn.click();
});

/* Welcome */
window.onload=()=>{
    addMessage("Hello! Upload an image and enter a prompt.","ai");
};
</script>

</body>
</html>
