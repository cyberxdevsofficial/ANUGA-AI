<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anuga AI</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --bg-color: #f3f4f6;
            --chat-bg: #ffffff;
            --user-msg-bg: #4f46e5;
            --ai-msg-bg: #e5e7eb;
            --text-color: #1f2937;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            height: 100vh;
            color: var(--text-color);
        }

        /* Login Screen */
        #login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            position: absolute;
            z-index: 10;
            background-color: white;
        }

        .login-card {
            text-align: center;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .google-btn {
            background-color: white;
            color: #757575;
            border: 1px solid #ddd;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background-color 0.3s;
        }

        .google-btn:hover {
            background-color: #f1f1f1;
        }

        /* Chat Interface */
        #app-container {
            display: none; /* Hidden until logged in */
            flex-direction: column;
            width: 100%;
            max-width: 800px;
            height: 100%;
            background-color: var(--chat-bg);
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        header {
            padding: 1rem;
            background-color: var(--primary-color);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 10px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .user-message {
            align-self: flex-end;
            background-color: var(--user-msg-bg);
            color: white;
            border-bottom-right-radius: 2px;
        }

        .ai-message {
            align-self: flex-start;
            background-color: var(--ai-msg-bg);
            color: var(--text-color);
            border-bottom-left-radius: 2px;
        }

        .ai-image {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 5px;
        }

        .input-area {
            padding: 1rem;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 10px;
            background-color: white;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 5px;
            outline: none;
        }

        button.send-btn {
            padding: 10px 20px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button.send-btn:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            padding: 0 1rem;
            background: #fff;
            border-bottom: 1px solid #eee;
        }
        
        .mode-btn {
            background: none;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            color: #666;
            border-bottom: 2px solid transparent;
        }

        .mode-btn.active {
            color: var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
            font-weight: bold;
        }

        .loading {
            font-style: italic;
            color: #666;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

    <!-- Login Screen -->
    <div id="login-screen">
        <div class="login-card">
            <h1>Welcome to Anuga AI</h1>
            <p>Please sign in to continue</p>
            <button id="google-login-btn" class="google-btn">
                <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
                    <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"></path>
                    <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.715H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"></path>
                    <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"></path>
                    <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.159 6.656 3.58 9 3.58z" fill="#EA4335"></path>
                </svg>
                Sign in with Google
            </button>
        </div>
    </div>

    <!-- Main App -->
    <div id="app-container">
        <header>
            <h3>Anuga AI</h3>
            <button id="logout-btn" style="background:none; border:1px solid white; color:white; padding:5px 10px; border-radius:4px; cursor:pointer;">Logout</button>
        </header>

        <div class="mode-selector">
            <button class="mode-btn active" onclick="setMode('chat')">Chat</button>
            <button class="mode-btn" onclick="setMode('text')">Text Gen (Pollination)</button>
            <button class="mode-btn" onclick="setMode('image')">Image Gen</button>
        </div>

        <div id="chat-history">
            <div class="message ai-message">Hello! I am Anuga AI. Select a mode above and start interacting.</div>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Type your message..." autocomplete="off">
            <button id="send-btn" class="send-btn">Send</button>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAMOO_h3b-dYognoDEl9udim-cD4ZOBpXs",
            authDomain: "anuga-ai.firebaseapp.com",
            projectId: "anuga-ai",
            storageBucket: "anuga-ai.firebasestorage.app",
            messagingSenderId: "853496698656",
            appId: "1:853496698656:web:500862c1e813b37c25a945"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // DOM Elements
        const loginScreen = document.getElementById('login-screen');
        const appContainer = document.getElementById('app-container');
        const loginBtn = document.getElementById('google-login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const chatHistory = document.getElementById('chat-history');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        let currentMode = 'chat'; // chat, text, image

        // Auth State Observer
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // User is signed in
                loginScreen.style.display = 'none';
                appContainer.style.display = 'flex';
                console.log("Logged in as:", user.email);
            } else {
                // User is signed out
                loginScreen.style.display = 'flex';
                appContainer.style.display = 'none';
            }
        });

        // Login Function
        loginBtn.addEventListener('click', () => {
            signInWithPopup(auth, provider)
                .then((result) => {
                    console.log("Login successful");
                }).catch((error) => {
                    console.error("Login error:", error);
                    alert("Login failed: " + error.message);
                });
        });

        // Logout Function
        logoutBtn.addEventListener('click', () => {
            signOut(auth).then(() => {
                console.log("Logged out");
            });
        });

        // Global Mode Setter
        window.setMode = (mode) => {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // Update placeholder based on mode
            if(mode === 'image') {
                userInput.placeholder = "Describe an image to generate...";
            } else if (mode === 'text') {
                userInput.placeholder = "Enter text prompt for generation...";
            } else {
                userInput.placeholder = "Type your message...";
            }
        };

        // Send Message Logic
        async function handleSend() {
            const text = userInput.value.trim();
            if (!text) return;

            // Add User Message to UI
            addMessage(text, 'user');
            userInput.value = '';
            setLoading(true);

            try {
                let responseContent = "";
                let isImage = false;

                if (currentMode === 'chat') {
                    // API: https://www.movanest.xyz/v2/powerbrainai?query=
                    const url = `https://www.movanest.xyz/v2/powerbrainai?query=${encodeURIComponent(text)}`;
                    const res = await fetch(url);
                    if (!res.ok) throw new Error('Chat API failed');
                    // Assuming the API returns plain text or JSON. Adjust parsing if needed.
                    responseContent = await res.text(); 
                    
                    // Clean up if it returns JSON wrapper like {"result": "..."}
                    try {
                        const json = JSON.parse(responseContent);
                        if(json.result) responseContent = json.result;
                        else if(json.response) responseContent = json.response;
                    } catch(e) { /* It's likely plain text */ }

                } else if (currentMode === 'text') {
                    // API: https://www.movanest.xyz/v2/pollination?text=
                    const url = `https://www.movanest.xyz/v2/pollination?text=${encodeURIComponent(text)}`;
                    const res = await fetch(url);
                    if (!res.ok) throw new Error('Text Gen API failed');
                    responseContent = await res.text();

                } else if (currentMode === 'image') {
                    // API: https://dtz-ai-api-new.vercel.app/api/ai/ai-image?prompt=
                    const url = `https://dtz-ai-api-new.vercel.app/api/ai/ai-image?prompt=${encodeURIComponent(text)}`;
                    const res = await fetch(url);
                    if (!res.ok) throw new Error('Image API failed');
                    
                    // Assuming this API returns a JSON with an image URL
                    const data = await res.json();
                    
                    // NOTE: You might need to adjust 'data.url' depending on the actual JSON structure returned by dtz-ai-api
                    // Common structures: data.url, data.image, data[0].url
                    const imageUrl = data.url || data.image || data.output || (typeof data === 'string' ? data : null);

                    if (imageUrl) {
                        responseContent = imageUrl;
                        isImage = true;
                    } else {
                        responseContent = "Failed to generate image. API response: " + JSON.stringify(data);
                    }
                }

                addMessage(responseContent, 'ai', isImage);

            } catch (error) {
                console.error(error);
                addMessage("Error: Could not connect to Anuga AI service. " + error.message, 'ai');
            } finally {
                setLoading(false);
            }
        }

        // UI Helpers
        function addMessage(content, sender, isImage = false) {
            const div = document.createElement('div');
            div.classList.add('message');
            div.classList.add(sender === 'user' ? 'user-message' : 'ai-message');

            if (isImage) {
                const img = document.createElement('img');
                img.src = content;
                img.classList.add('ai-image');
                img.alt = "Generated Image";
                div.appendChild(img);
            } else {
                div.textContent = content;
            }

            chatHistory.appendChild(div);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        function setLoading(isLoading) {
            sendBtn.disabled = isLoading;
            userInput.disabled = isLoading;
            if (isLoading) {
                const loadingDiv = document.createElement('div');
                loadingDiv.id = 'loading-indicator';
                loadingDiv.classList.add('message', 'ai-message', 'loading');
                loadingDiv.textContent = 'Anuga AI is thinking...';
                chatHistory.appendChild(loadingDiv);
                chatHistory.scrollTop = chatHistory.scrollHeight;
            } else {
                const loadingDiv = document.getElementById('loading-indicator');
                if (loadingDiv) loadingDiv.remove();
            }
        }

        // Event Listeners
        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });

    </script>
</body>
</html>
